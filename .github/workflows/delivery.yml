name: Delivery

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Maven verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend SPA
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Verify
        run: ./mvnw -B -ntp clean verify

      - name: Package Azure Functions API
        run: ./mvnw -B -ntp -Pazure-functions -DskipTests package

      - name: Retain Azure Functions package
        uses: actions/upload-artifact@v6
        with:
          name: azure-functions-api-${{ github.sha }}
          path: target/azure-functions/url-shortener-api-test
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Scan and publish container
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for security gate
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: url-shortener:security-gate
          cache-from: type=gha,scope=delivery
          cache-to: type=gha,mode=max,scope=delivery

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: url-shortener:security-gate
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=URL Shortener
            org.opencontainers.image.description=Spring Boot URL shortener API and worker

      - name: Publish signed-build metadata and image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=delivery
          cache-to: type=gha,mode=max,scope=delivery
          provenance: mode=max
          sbom: true

      - name: Summarize publication
        shell: bash
        run: |
          {
            echo "### Published container"
            echo
            echo "- Image: \`${{ steps.image.outputs.name }}\`"
            echo "- Digest: \`${{ steps.publish.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
