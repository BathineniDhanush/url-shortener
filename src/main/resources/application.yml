spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:url_shortener}
    username: ${DB_USER:url_shortener}
    password: ${DB_PASSWORD:url_shortener}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      maximum-pool-size: ${DB_POOL_SIZE:10}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
app:
  runtime:
    role: api
  links:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    creation-rate-limit: ${LINK_CREATION_RATE_LIMIT:20}
    creation-rate-window: ${LINK_CREATION_RATE_WINDOW:60s}
  analytics:
    consumer-name: ${ANALYTICS_CONSUMER_NAME:worker-1}
    max-attempts: ${ANALYTICS_MAX_ATTEMPTS:3}
